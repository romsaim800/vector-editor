<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vector Editor</title>
<style>
  :root { --bg:#1e1e1e; --panel:#2b2b2b; --bar:#323232; --stage:#3c3c3c; --line:#444; --accent:#2a7de1; --text:#e6e6e6; --muted:#9a9a9a; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:system-ui, "Noto Sans Bengali", sans-serif; -webkit-user-select:none; user-select:none; }
  body { display:flex; flex-direction:column; }
  button { font-family:inherit; }

  #top { display:flex; align-items:center; gap:10px; padding:6px 8px; background:var(--bar); border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap; flex:0 0 auto; }
  #top > * { flex:0 0 auto; }
  .grp { display:flex; align-items:center; gap:4px; }
  .grp > svg { width:18px; height:18px; color:var(--muted); }
  .sw { position:relative; width:38px; height:38px; border:2px solid #777; border-radius:6px; overflow:hidden; }
  .sw input { position:absolute; left:-4px; top:-4px; width:48px; height:48px; border:0; padding:0; background:none; }
  .sw.none::after { content:""; position:absolute; left:0; top:0; right:0; bottom:0; background:linear-gradient(to top right, transparent 46%, #e5392d 46%, #e5392d 54%, transparent 54%), #fff; pointer-events:none; }
  .ib { width:44px; height:44px; border:0; border-radius:8px; background:transparent; color:var(--text); display:flex; align-items:center; justify-content:center; padding:0; flex:0 0 auto; }
  .ib.small { width:34px; height:34px; background:#444; }
  .ib.on { background:var(--accent); }
  .ib svg { width:24px; height:24px; }
  .ib.small svg { width:18px; height:18px; }
  #sw-val { width:52px; height:34px; box-sizing:border-box; text-align:center; font-size:15px; border:1px solid #666; border-radius:6px; background:#1b1b1b; color:var(--text); }
  #op { width:90px; }
  #op-val { font-size:13px; color:var(--muted); width:38px; }
  #sides { height:34px; font-size:15px; border:1px solid #666; border-radius:6px; background:#1b1b1b; color:var(--text); }
  #sidesGrp { display:none; }
  .sep { width:1px; height:28px; background:var(--line); }

  #main { flex:1; min-height:0; display:flex; }
  #tools { flex:0 0 54px; background:var(--panel); border-right:1px solid var(--line); overflow-y:auto; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; }
  #stage { flex:1; min-width:0; display:flex; align-items:center; justify-content:center; background:var(--stage); overflow:hidden; }
  #c { display:block; background:#fff; touch-action:none; box-shadow:0 2px 14px rgba(0,0,0,.55); }

  #status { flex:0 0 auto; padding:6px 10px; background:var(--panel); border-top:1px solid var(--line); font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:10px; }

  #dlg { position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,.7); display:flex; align-items:center; justify-content:center; z-index:10; }
  #box { background:var(--panel); padding:16px; border-radius:12px; width:92vw; max-width:360px; position:relative; max-height:92vh; overflow:auto; }
  #box h3 { margin:0 0 12px; font-size:18px; }
  #box label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  #box input, #box select { width:100%; box-sizing:border-box; min-height:44px; font-size:16px; padding:0 10px; border-radius:8px; border:1px solid #666; background:#1b1b1b; color:var(--text); }
  .row { display:flex; gap:8px; }
  .row > div { flex:1; }
  #presets { display:flex; flex-wrap:wrap; gap:6px; }
  #presets button { flex:1 1 45%; min-height:44px; border:0; border-radius:8px; background:#444; color:var(--text); font-size:14px; }
  #create { width:100%; min-height:48px; margin-top:16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; }
  #closeDlg { position:absolute; right:6px; top:6px; display:none; }
</style>
</head>
<body>

<div id="top">
  <div class="grp" id="fillGrp">
    <svg viewBox="0 0 24 24" data-icon="fill" fill="none" stroke="currentColor" stroke-width="2"></svg>
    <div class="sw" id="fillSw"><input type="color" id="fill" value="#2a7de1"></div>
    <button class="ib small" id="fillNone" data-icon="none" aria-label="ফিল নেই"></button>
  </div>
  <div class="grp" id="strokeGrp">
    <svg viewBox="0 0 24 24" data-icon="stroke" fill="none" stroke="currentColor" stroke-width="2"></svg>
    <div class="sw" id="strokeSw"><input type="color" id="stroke" value="#000000"></div>
    <button class="ib small" id="strokeNone" data-icon="none" aria-label="স্ট্রোক নেই"></button>
  </div>
  <div class="grp">
    <button class="ib small" id="swMinus" data-icon="minus" aria-label="স্ট্রোক কমান"></button>
    <input type="number" id="sw-val" value="4" min="0" max="500" inputmode="decimal">
    <button class="ib small" id="swPlus" data-icon="plus" aria-label="স্ট্রোক বাড়ান"></button>
  </div>
  <div class="grp">
    <svg viewBox="0 0 24 24" data-icon="opacity" fill="none" stroke="currentColor" stroke-width="2"></svg>
    <input type="range" id="op" min="0" max="100" value="100">
    <span id="op-val">100%</span>
  </div>
  <div class="grp" id="sidesGrp">
    <svg viewBox="0 0 24 24" data-icon="polygon" fill="none" stroke="currentColor" stroke-width="2"></svg>
    <select id="sides">
      <option>3</option><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option>
    </select>
  </div>
  <div class="sep"></div>
  <button class="ib" id="del" data-icon="del" aria-label="মুছুন"></button>
  <button class="ib" id="newc" data-icon="newc" aria-label="নতুন ক্যানভাস"></button>
  <button class="ib" id="save" data-icon="save" aria-label="SVG সেভ"></button>
</div>

<div id="main">
  <div id="tools">
    <button class="ib on" id="t-select" data-icon="select" aria-label="সিলেক্ট"></button>
    <button class="ib" id="t-rect" data-icon="rect" aria-label="চতুর্ভুজ"></button>
    <button class="ib" id="t-ellipse" data-icon="ellipse" aria-label="বৃত্ত"></button>
    <button class="ib" id="t-line" data-icon="line" aria-label="লাইন"></button>
    <button class="ib" id="t-polygon" data-icon="polygon" aria-label="পলিগন"></button>
    <button class="ib" id="t-star" data-icon="star" aria-label="স্টার"></button>
  </div>
  <div id="stage">
    <svg id="c"><rect id="bg" x="0" y="0" fill="#fff"/><g id="art"></g><g id="ui"></g></svg>
  </div>
</div>

<div id="status"><span id="info"></span><span id="toolname"></span></div>

<div id="dlg">
  <div id="box">
    <button class="ib" id="closeDlg" data-icon="close" aria-label="বন্ধ"></button>
    <h3>নতুন ক্যানভাস</h3>
    <div id="presets">
      <button data-w="1080" data-h="1080" data-p="72">1080 × 1080</button>
      <button data-w="1920" data-h="1080" data-p="72">1920 × 1080</button>
      <button data-w="1080" data-h="1920" data-p="72">1080 × 1920</button>
      <button data-w="2480" data-h="3508" data-p="300">A4 (300 PPI)</button>
    </div>
    <div class="row">
      <div><label>প্রস্থ (px)</label><input type="number" id="w" value="1080"></div>
      <div><label>উচ্চতা (px)</label><input type="number" id="h" value="1080"></div>
    </div>
    <label>রেজোলিউশন (PPI)</label>
    <select id="ppi">
      <option value="72">72</option>
      <option value="150">150</option>
      <option value="300">300</option>
    </select>
    <button id="create">তৈরি করুন</button>
  </div>
</div>

<script>
var NS = "http://www.w3.org/2000/svg";
var $ = function (id) { return document.getElementById(id); };
var svg = $("c"), bg = $("bg"), art = $("art"), ui = $("ui");
var stage = $("stage"), info = $("info"), dlg = $("dlg");

var tool = "select", sel = null, drag = null;
var W = 0, H = 0, PPI = 72;
var st = { fill: "#2a7de1", fillNone: false, stroke: "#000000", strokeNone: false, sw: 4, op: 100, sides: 6 };

var TOOLNAMES = { select: "সিলেক্ট", rect: "চতুর্ভুজ", ellipse: "বৃত্ত", line: "লাইন", polygon: "পলিগন", star: "স্টার" };

var ICONS = {
  select: '<path d="M5 3l14 8-6 2-2 6z"/>',
  rect: '<rect x="4" y="6" width="16" height="12" rx="1"/>',
  ellipse: '<ellipse cx="12" cy="12" rx="9" ry="6"/>',
  line: '<path d="M5 19L19 5"/>',
  polygon: '<path d="M12 3l8 5v8l-8 5-8-5V8z"/>',
  star: '<path d="M12 3l2.7 5.8 6.3.8-4.6 4.4 1.2 6.3-5.6-3-5.6 3 1.2-6.3L3 9.6l6.3-.8z"/>',
  del: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  save: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  newc: '<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/>',
  close: '<path d="M6 6l12 12M18 6L6 18"/>',
  none: '<path d="M5 19L19 5" stroke="#e5392d"/><rect x="5" y="5" width="14" height="14"/>',
  minus: '<path d="M6 12h12"/>',
  plus: '<path d="M6 12h12M12 6v12"/>',
  fill: '<rect x="5" y="5" width="14" height="14" fill="currentColor"/>',
  stroke: '<rect x="5" y="5" width="14" height="14"/>',
  opacity: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>'
};
(function () {
  var list = document.querySelectorAll("[data-icon]");
  for (var i = 0; i < list.length; i++) {
    var el = list[i];
    var inner = ICONS[el.getAttribute("data-icon")];
    if (el.tagName.toLowerCase() === "svg") {
      el.innerHTML = inner;
    } else {
      el.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
    }
  }
})();

function scale() { return W / svg.getBoundingClientRect().width; }

function fit() {
  if (!W) return;
  var r = stage.getBoundingClientRect();
  var s = Math.min((r.width - 24) / W, (r.height - 24) / H);
  svg.style.width = (W * s) + "px";
  svg.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);

function pt(e) {
  var r = svg.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

/* ---------- control bar <-> state ---------- */
function refreshCtl() {
  $("fill").value = st.fill;
  $("stroke").value = st.stroke;
  $("fillSw").className = "sw" + (st.fillNone ? " none" : "");
  $("strokeSw").className = "sw" + (st.strokeNone ? " none" : "");
  $("sw-val").value = st.sw;
  $("op").value = st.op;
  $("op-val").textContent = st.op + "%";
  $("sides").value = String(st.sides);
}

function applyTo(el) {
  if (!el) return;
  if (el._type !== "line") {
    el.setAttribute("fill", st.fillNone ? "none" : st.fill);
  } else {
    el.setAttribute("fill", "none");
  }
  el.setAttribute("stroke", st.strokeNone ? "none" : st.stroke);
  el.setAttribute("stroke-width", st.sw);
  el.setAttribute("opacity", st.op / 100);
}

function syncFromSel() {
  if (!sel) return;
  var f = sel.getAttribute("fill");
  if (sel._type !== "line") {
    st.fillNone = (f === "none");
    if (f && f !== "none") st.fill = f;
  }
  var s = sel.getAttribute("stroke");
  st.strokeNone = (s === "none" || !s);
  if (s && s !== "none") st.stroke = s;
  var w = parseFloat(sel.getAttribute("stroke-width"));
  if (!isNaN(w)) st.sw = w;
  var o = parseFloat(sel.getAttribute("opacity"));
  if (!isNaN(o)) st.op = Math.round(o * 100);
  refreshCtl();
}

function changed() { applyTo(sel); drawOutline(); }

$("fill").oninput = function (e) { st.fill = e.target.value; st.fillNone = false; refreshCtl(); changed(); };
$("stroke").oninput = function (e) { st.stroke = e.target.value; st.strokeNone = false; refreshCtl(); changed(); };
$("fillNone").onclick = function () { st.fillNone = !st.fillNone; refreshCtl(); changed(); };
$("strokeNone").onclick = function () { st.strokeNone = !st.strokeNone; refreshCtl(); changed(); };

function setSW(v) {
  v = parseFloat(v);
  if (isNaN(v)) return;
  st.sw = Math.max(0, Math.min(500, v));
  refreshCtl();
  changed();
}
$("sw-val").onchange = function (e) { setSW(e.target.value); };
$("swMinus").onclick = function () { setSW(st.sw - 1); };
$("swPlus").onclick = function () { setSW(st.sw + 1); };

$("op").oninput = function (e) { st.op = parseInt(e.target.value, 10); refreshCtl(); changed(); };
$("sides").onchange = function (e) { st.sides = parseInt(e.target.value, 10); };

/* ---------- canvas dialog ---------- */
function openDialog() {
  $("closeDlg").style.display = W ? "flex" : "none";
  dlg.style.display = "flex";
}

function createCanvas(w, h, ppi) {
  W = w; H = h; PPI = ppi;
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  bg.setAttribute("width", w);
  bg.setAttribute("height", h);
  art.innerHTML = "";
  ui.innerHTML = "";
  sel = null; drag = null;
  info.textContent = W + " × " + H + " px · " + PPI + " PPI";
  dlg.style.display = "none";
  fit();
}

var presetBtns = document.querySelectorAll("#presets button");
for (var j = 0; j < presetBtns.length; j++) {
  presetBtns[j].onclick = function () {
    $("w").value = this.getAttribute("data-w");
    $("h").value = this.getAttribute("data-h");
    $("ppi").value = this.getAttribute("data-p");
  };
}
$("create").onclick = function () {
  var w = parseInt($("w").value, 10);
  var h = parseInt($("h").value, 10);
  var p = parseInt($("ppi").value, 10);
  if (!(w >= 16 && w <= 8000 && h >= 16 && h <= 8000)) {
    alert("প্রস্থ ও উচ্চতা ১৬ থেকে ৮০০০ এর মধ্যে দিন।");
    return;
  }
  createCanvas(w, h, p);
};
$("closeDlg").onclick = function () { dlg.style.display = "none"; };
$("newc").onclick = function () {
  if (art.childNodes.length > 0 && !confirm("বর্তমান কাজ মুছে যাবে। চালিয়ে যাবেন?")) return;
  openDialog();
};

/* ---------- tools ---------- */
var TOOLS = ["select", "rect", "ellipse", "line", "polygon", "star"];
function setTool(t) {
  tool = t;
  for (var i = 0; i < TOOLS.length; i++) {
    $("t-" + TOOLS[i]).className = (TOOLS[i] === t) ? "ib on" : "ib";
  }
  $("sidesGrp").style.display = (t === "polygon") ? "flex" : "none";
  $("toolname").textContent = TOOLNAMES[t];
}
TOOLS.forEach(function (n) { $("t-" + n).onclick = function () { setTool(n); }; });

/* ---------- selection outline ---------- */
function drawOutline() {
  ui.innerHTML = "";
  if (!sel) return;
  var b = sel.getBBox();
  var pad = 6 * scale();
  var o = document.createElementNS(NS, "rect");
  o.setAttribute("x", b.x - pad); o.setAttribute("y", b.y - pad);
  o.setAttribute("width", b.width + pad * 2); o.setAttribute("height", b.height + pad * 2);
  o.setAttribute("fill", "none");
  o.setAttribute("stroke", "#2a7de1");
  o.setAttribute("stroke-width", "2");
  o.setAttribute("stroke-dasharray", "6 4");
  o.setAttribute("vector-effect", "non-scaling-stroke");
  o.setAttribute("pointer-events", "none");
  o.setAttribute("transform", sel.getAttribute("transform") || "");
  ui.appendChild(o);
}

function select(el) {
  sel = el;
  if (el) syncFromSel();
  drawOutline();
}

/* ---------- shapes ---------- */
function make(type) {
  var tag = { rect: "rect", ellipse: "ellipse", line: "line", polygon: "polygon", star: "polygon" }[type];
  var el = document.createElementNS(NS, tag);
  el._type = type;
  el.setAttribute("pointer-events", "all");
  el.setAttribute("stroke-linejoin", "round");
  el.setAttribute("stroke-linecap", "round");
  return el;
}

function ngon(cx, cy, r, n) {
  var pts = [];
  for (var i = 0; i < n; i++) {
    var a = -Math.PI / 2 + i * 2 * Math.PI / n;
    pts.push((cx + r * Math.cos(a)).toFixed(2) + "," + (cy + r * Math.sin(a)).toFixed(2));
  }
  return pts.join(" ");
}

function star(cx, cy, r) {
  var pts = [];
  for (var i = 0; i < 10; i++) {
    var rr = (i % 2 === 0) ? r : r * 0.4;
    var a = -Math.PI / 2 + i * Math.PI / 5;
    pts.push((cx + rr * Math.cos(a)).toFixed(2) + "," + (cy + rr * Math.sin(a)).toFixed(2));
  }
  return pts.join(" ");
}

function shape(el, x0, y0, x1, y1) {
  var t = el._type;
  if (t === "rect" || t === "ellipse") {
    var x = Math.min(x0, x1), y = Math.min(y0, y1);
    var w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
    if (t === "rect") {
      el.setAttribute("x", x); el.setAttribute("y", y);
      el.setAttribute("width", w); el.setAttribute("height", h);
    } else {
      el.setAttribute("cx", x + w / 2); el.setAttribute("cy", y + h / 2);
      el.setAttribute("rx", w / 2); el.setAttribute("ry", h / 2);
    }
  } else if (t === "line") {
    el.setAttribute("x1", x0); el.setAttribute("y1", y0);
    el.setAttribute("x2", x1); el.setAttribute("y2", y1);
  } else {
    var r = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0));
    el.setAttribute("points", t === "star" ? star(x0, y0, r) : ngon(x0, y0, r, st.sides));
  }
}

function distSeg(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var l2 = dx * dx + dy * dy;
  var t = l2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  var cx = x1 + t * dx, cy = y1 + t * dy;
  return Math.sqrt((px - cx) * (px - cx) + (py - cy) * (py - cy));
}

function pick(e, p) {
  var t = e.target;
  if (t && t.parentNode === art) return t;
  var tol = 16 * scale();
  for (var i = art.childNodes.length - 1; i >= 0; i--) {
    var el = art.childNodes[i];
    if (el._type !== "line") continue;
    var tx = el._tx || 0, ty = el._ty || 0;
    var d = distSeg(p.x - tx, p.y - ty,
      parseFloat(el.getAttribute("x1")), parseFloat(el.getAttribute("y1")),
      parseFloat(el.getAttribute("x2")), parseFloat(el.getAttribute("y2")));
    if (d <= tol) return el;
  }
  return null;
}

/* ---------- pointer events ---------- */
svg.addEventListener("pointerdown", function (e) {
  if (!W || dlg.style.display === "flex") return;
  var p = pt(e);
  svg.setPointerCapture(e.pointerId);
  if (tool === "select") {
    var el = pick(e, p);
    if (el) {
      select(el);
      drag = { x: p.x, y: p.y, el: el, ox: el._tx || 0, oy: el._ty || 0, move: true };
    } else {
      select(null);
    }
  } else {
    if (tool === "line" && st.strokeNone) { st.strokeNone = false; refreshCtl(); }
    var n = make(tool);
    applyTo(n);
    art.appendChild(n);
    drag = { x: p.x, y: p.y, el: n, move: false };
  }
});

svg.addEventListener("pointermove", function (e) {
  if (!drag) return;
  var p = pt(e);
  if (drag.move) {
    drag.el._tx = drag.ox + (p.x - drag.x);
    drag.el._ty = drag.oy + (p.y - drag.y);
    drag.el.setAttribute("transform", "translate(" + drag.el._tx + "," + drag.el._ty + ")");
    drawOutline();
  } else {
    shape(drag.el, drag.x, drag.y, p.x, p.y);
  }
});

function finish() {
  if (!drag) return;
  if (!drag.move) {
    var minSize = 6 * scale();
    var el = drag.el, tiny;
    if (el._type === "line") {
      var dx = parseFloat(el.getAttribute("x2")) - parseFloat(el.getAttribute("x1"));
      var dy = parseFloat(el.getAttribute("y2")) - parseFloat(el.getAttribute("y1"));
      tiny = isNaN(dx) || Math.sqrt(dx * dx + dy * dy) < minSize;
    } else {
      var b = el.getBBox();
      tiny = b.width < minSize || b.height < minSize;
    }
    if (tiny) { el.remove(); } else { select(el); }
  }
  drag = null;
}
svg.addEventListener("pointerup", finish);
svg.addEventListener("pointercancel", finish);

/* ---------- delete & save ---------- */
$("del").onclick = function () {
  if (sel) { sel.remove(); select(null); }
};

$("save").onclick = function () {
  if (!W) return;
  select(null);
  var clone = art.cloneNode(true);
  for (var i = 0; i < clone.childNodes.length; i++) {
    clone.childNodes[i].removeAttribute("pointer-events");
  }
  var out = '<svg xmlns="' + NS + '" width="' + W + '" height="' + H +
    '" viewBox="0 0 ' + W + ' ' + H + '">' +
    '<rect width="' + W + '" height="' + H + '" fill="#ffffff"/>' +
    clone.innerHTML + '</svg>';
  var blob = new Blob([out], { type: "image/svg+xml" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "drawing.svg";
  document.body.appendChild(a);
  a.click();
  a.remove();
};

setTool("select");
refreshCtl();
openDialog();
</script>
